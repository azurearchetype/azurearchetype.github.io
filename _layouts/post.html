---
layout: default
---

<small>{{ page.date | date: "%-d %B %Y" }}</small>
<h1>{{ page.title }}</h1>
{% if page.subtitle %}
<div style="font-size: 2.2em; color: #4a9eff; margin-top: -10px; margin-bottom: 15px; font-weight: bold;">{{ page.subtitle }}</div>
{% endif %}
<p class="view">by {{ page.author | default: site.author }}</p>

{{content}}

{% if page.tags %}
  <small>tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small>
{% endif %}

<p></p>
<a href='{{azurearchetype.com}}/'>Back</a>
